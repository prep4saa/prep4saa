name: Deploy Flow Test

on:
  workflow_dispatch:
    inputs:
      force_health_failure:
        description: 'Force health check failure to test rollback'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-flow-test
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: 1. Build artifact
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_LEMON_SQUEEZY_STORE_ID: ${{ secrets.VITE_LEMON_SQUEEZY_STORE_ID }}
          VITE_LEMON_SQUEEZY_PRODUCT_ID: ${{ secrets.VITE_LEMON_SQUEEZY_PRODUCT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-dist-${{ github.run_id }}
          path: dist/
          retention-days: 1

  simulate-deploy:
    name: 2. Simulate deploy, health check, rollback
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: test-dist-${{ github.run_id }}
          path: dist/

      - name: Prepare fake S3 bucket
        run: |
          mkdir -p /tmp/mock-s3/current /tmp/mock-s3/backups
          cat > /tmp/mock-s3/current/index.html <<'HTML'
          <html><body><h1>Previous production version</h1></body></html>
          HTML
          echo "old asset" > /tmp/mock-s3/current/old-asset.txt
          echo "Fake current deployment:"
          find /tmp/mock-s3/current -maxdepth 2 -type f | sort

      - name: Backup current deployment
        id: backup
        run: |
          BACKUP_PREFIX="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          echo "prefix=$BACKUP_PREFIX" >> "$GITHUB_OUTPUT"
          mkdir -p "/tmp/mock-s3/backups/$BACKUP_PREFIX"
          cp -a /tmp/mock-s3/current/. "/tmp/mock-s3/backups/$BACKUP_PREFIX/"
          echo "Backup created at /tmp/mock-s3/backups/$BACKUP_PREFIX"
          find "/tmp/mock-s3/backups/$BACKUP_PREFIX" -maxdepth 2 -type f | sort

      - name: Deploy static assets
        run: |
          rm -rf /tmp/mock-s3/current
          mkdir -p /tmp/mock-s3/current
          cp -a dist/. /tmp/mock-s3/current/
          echo "New deployment files:"
          find /tmp/mock-s3/current -maxdepth 3 -type f | sort | head -50

      - name: Invalidate CloudFront cache
        run: |
          echo "Simulation only: CloudFront invalidation would run here."

      - name: Wait for CDN propagation
        run: sleep 5

      - name: Health check
        run: |
          if [ "${{ inputs.force_health_failure }}" = "true" ]; then
            echo "Forced failure enabled. This intentionally fails to show rollback."
            exit 1
          fi

          RESPONSE_FILE="/tmp/mock-s3/current/index.html"
          BODY_SIZE=$(wc -c < "$RESPONSE_FILE")

          echo "Mock HTTP status: 200"
          echo "Body size: $BODY_SIZE bytes"

          if [ "$BODY_SIZE" -lt 500 ]; then
            echo "Health check failed: response too small ($BODY_SIZE bytes)"
            exit 1
          fi

          if ! grep -qi "<html" "$RESPONSE_FILE"; then
            echo "Health check failed: <html> tag not found"
            exit 1
          fi

          echo "Health check passed"

      - name: Rollback on failure
        id: rollback
        if: failure() && steps.backup.outcome == 'success'
        run: |
          echo "Rolling back to ${{ steps.backup.outputs.prefix }}"
          rm -rf /tmp/mock-s3/current
          mkdir -p /tmp/mock-s3/current
          cp -a "/tmp/mock-s3/backups/${{ steps.backup.outputs.prefix }}/." /tmp/mock-s3/current/
          echo "Restored files:"
          find /tmp/mock-s3/current -maxdepth 2 -type f | sort

      - name: Verify rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          RESPONSE_FILE="/tmp/mock-s3/current/index.html"
          BODY_SIZE=$(wc -c < "$RESPONSE_FILE")

          echo "Mock HTTP status after rollback: 200"
          echo "Body size after rollback: $BODY_SIZE bytes"

          if ! grep -qi "Previous production version" "$RESPONSE_FILE"; then
            echo "Rollback verification failed: previous version marker not found"
            exit 1
          fi

          echo "Rollback verification passed"
