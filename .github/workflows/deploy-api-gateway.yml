# ===================================================================
# API Gateway 배포 워크플로우
# - lambda-webhook/api-gateway-config.yaml 변경 시 자동 트리거
# - CloudFormation 템플릿으로 API Gateway 스택 생성/업데이트
#
# ⚠️ 주의: 현재 영구 AWS 키(secrets.AWS_ACCESS_KEY_ID/SECRET) 사용 중
#         Day 1 OIDC 마이그레이션에서 이 키들이 삭제되었으므로
#         이 워크플로우는 트리거되면 실패함.
#         → TODO: OIDC Role assume 방식으로 전환 필요 (deploy.yml 참고)
# ===================================================================
name: Deploy API Gateway

on:
  # Disabled: lambda-webhook removed during Firebase->Cognito migration.
  # Manual-only until OIDC migration is done.
  workflow_dispatch:

jobs:
  deploy-api-gateway:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # ⚠️ 영구 AWS 키 인증 — OIDC로 마이그레이션 예정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # CloudFormation으로 API Gateway 스택 배포 (idempotent)
      # --no-fail-on-empty-changeset: 변경사항 없어도 실패 처리 안 함
      # CAPABILITY_IAM: IAM 리소스 생성 권한 명시 (CloudFormation 요구사항)
      - name: Deploy API Gateway CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --template-file lambda-webhook/api-gateway-config.yaml \
            --stack-name lemon-squeezy-api-gateway \
            --region us-east-1 \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM

      # 배포된 API endpoint URL을 출력
      # → 새 endpoint면 VITE_BACKEND_URL secret 업데이트 필요
      - name: Get API Gateway Endpoint
        run: |
          API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name lemon-squeezy-api-gateway \
            --region us-east-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)

          echo "✅ API Gateway deployed successfully!"
          echo "API Endpoint: $API_ENDPOINT"
          echo ""
          echo "📝 To update your GitHub Secrets, set VITE_BACKEND_URL to:"
          echo "$API_ENDPOINT"
