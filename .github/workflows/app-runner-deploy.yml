name: Deploy to App Runner

on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/app-runner-deploy.yml'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: prep4saa-server
  APP_RUNNER_SERVICE_NAME: prep4saa-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create App Runner service or update if exists
        id: deploy
        env:
          ECR_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE_NAME }}'].ServiceArn" \
            --output text 2>/dev/null || echo "")

          if [ -z "$SERVICE_ARN" ]; then
            echo "Creating new App Runner service..."
            RESPONSE=$(aws apprunner create-service \
              --service-name ${{ env.APP_RUNNER_SERVICE_NAME }} \
              --source-configuration ImageRepository='{ImageIdentifier='${{ env.ECR_IMAGE }}',ImageRepositoryType=ECR,ImageConfiguration={Port=5000}}' \
              --instance-configuration InstanceRoleArn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AppRunnerECRAccessRole \
              --region ${{ env.AWS_REGION }} \
              --output json)
            SERVICE_ARN=$(echo $RESPONSE | jq -r '.Service.ServiceArn')
            echo "Created service: $SERVICE_ARN"
          else
            echo "Updating existing App Runner service..."
            aws apprunner update-service \
              --service-arn $SERVICE_ARN \
              --source-configuration ImageRepository='{ImageIdentifier='${{ env.ECR_IMAGE }}',ImageRepositoryType=ECR,ImageConfiguration={Port=5000}}' \
              --region ${{ env.AWS_REGION }}
          fi

          echo "service-arn=$SERVICE_ARN" >> $GITHUB_OUTPUT

      - name: Create environment variables config
        run: |
          cat > /tmp/env-vars.json << 'EOF'
          {
            "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "FIREBASE_SERVICE_ACCOUNT": "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}",
            "FIREBASE_DATABASE_URL": "${{ secrets.FIREBASE_DATABASE_URL }}",
            "LEMON_SQUEEZY_API_KEY": "${{ secrets.LEMON_SQUEEZY_API_KEY }}",
            "LEMON_SQUEEZY_WEBHOOK_SECRET": "${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}",
            "RESEND_API_KEY": "${{ secrets.RESEND_API_KEY }}",
            "CONTACT_EMAIL": "${{ secrets.CONTACT_EMAIL }}",
            "VITE_ADMIN_EMAIL": "${{ secrets.VITE_ADMIN_EMAIL }}",
            "NODE_ENV": "production"
          }
          EOF

      - name: Update App Runner environment variables
        run: |
          python3 << 'PYTHON'
          import json
          import subprocess
          import sys

          with open('/tmp/env-vars.json', 'r') as f:
              env_vars = json.load(f)

          # Convert to AWS CLI format
          env_list = [f"Name={k},Value={v}" for k, v in env_vars.items()]

          cmd = [
              'aws', 'apprunner', 'update-service',
              '--service-arn', '${{ steps.deploy.outputs.service-arn }}',
              '--instance-configuration', f'InstanceRoleArn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AppRunnerInstanceRole,EnvironmentVariables=[{",".join(env_list)}]',
              '--region', '${{ env.AWS_REGION }}'
          ]

          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode != 0:
              print(f"Error: {result.stderr}")
              sys.exit(1)
          print(f"Updated: {result.stdout}")
          PYTHON

      - name: Wait for service to be ready
        run: |
          for i in {1..30}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn ${{ steps.deploy.outputs.service-arn }} \
              --region ${{ env.AWS_REGION }} \
              --query 'Service.Status' \
              --output text)

            echo "Attempt $i: Service status is $STATUS"

            if [ "$STATUS" = "RUNNING" ]; then
              echo "✅ Service is running"
              break
            fi

            sleep 10
          done

      - name: Get service URL
        id: service-url
        run: |
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn ${{ steps.deploy.outputs.service-arn }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Service.ServiceUrl' \
            --output text)
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "✅ App Runner service URL: $SERVICE_URL"

      - name: Verify service is healthy
        run: |
          SERVICE_URL=${{ steps.service-url.outputs.url }}
          for i in {1..10}; do
            echo "Health check attempt $i..."
            if curl -f "$SERVICE_URL/health" >/dev/null 2>&1; then
              echo "✅ Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "⚠️ Health check timed out, but service was deployed"

      - name: Create deployment summary
        run: |
          echo "## 🚀 App Runner Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service Name:** prep4saa-server" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** ${{ steps.service-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Update \`VITE_BACKEND_URL\` in frontend build configuration" >> $GITHUB_STEP_SUMMARY
          echo "2. Redeploy frontend to S3/CloudFront" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR if it exists
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ App Runner service deployed!\n\n**Service URL:** ${{ steps.service-url.outputs.url }}\n\nUpdate VITE_BACKEND_URL and redeploy frontend.`
            })
