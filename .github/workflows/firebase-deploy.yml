# ===================================================================
# 프론트엔드 자동 배포 워크플로우 (GitHub Actions)
# - 코드를 main에 올리면 → 빌드 → S3 업로드 → CloudFront 캐시 비우기
# ===================================================================
name: Frontend CI/CD

# -------------------------------------------------------------------
# 🚦 언제 이 워크플로우가 실행되는가?1
# -------------------------------------------------------------------
on:
  # ① PR(Pull Request)이 main으로 들어올 때 → 빌드 검증만 수행 (배포 X)
  pull_request:
    branches:
      - main
    paths-ignore:                                  # 아래 파일들이 바뀌어도 무시 (불필요한 실행 방지)
      - 'lambda-webhook/**'                        #   - 람다 코드는 별도 워크플로우가 담당
      - '.github/workflows/deploy-api-gateway.yml' #   - API Gateway 워크플로우
      - '.github/workflows/lambda-deploy.yml'      #   - Lambda 배포 워크플로우
      - '**/*.md'                                  #   - 문서(.md) 파일은 빌드 불필요

  # ② main 브랜치에 직접 push될 때 → 빌드 + 실배포까지 수행
  push:
    branches:
      - main
    paths-ignore:
      - 'lambda-webhook/**'
      - '.github/workflows/deploy-api-gateway.yml'
      - '.github/workflows/lambda-deploy.yml'
      - '**/*.md'

  # ③ GitHub UI에서 "Run workflow" 버튼 누를 때 (수동 실행)
  workflow_dispatch:

# -------------------------------------------------------------------
# 🚧 동시 실행 제어 (한 줄에 한 명씩만 들어가기)
# -------------------------------------------------------------------
concurrency:
  group: frontend-production       # 같은 그룹 이름끼리는 동시 실행 불가
  cancel-in-progress: false        # 이미 실행 중인 건 취소하지 않고 끝까지 진행

# -------------------------------------------------------------------
# 🔐 권한 (최소 권한 원칙)
# -------------------------------------------------------------------
permissions:
  contents: read                   # 저장소 코드 읽기만 허용 (쓰기는 차단)

# -------------------------------------------------------------------
# 🌍 전역 환경변수 (모든 job에서 사용 가능)
# -------------------------------------------------------------------
env:
  NODE_VERSION: '22'                       # Node.js 버전
  AWS_REGION: us-east-1                    # AWS 지역 (버지니아 북부)
  S3_BUCKET: prep4saa.com                  # 정적파일이 올라갈 S3 버킷
  CLOUDFRONT_DISTRIBUTION_ID: E5O4C7TLOVEG7 # CDN(CloudFront) 배포 ID

# ===================================================================
# 🛠️  JOB 1: 빌드 검증 (validate)
# ===================================================================
jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest         # GitHub이 제공하는 Ubuntu 가상머신에서 실행

    steps:
      # 1) 코드 가져오기 (git clone과 동일)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Node.js 22 버전 설치 + npm 캐시 활성화 (재실행 시 빠르게)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # 3) package-lock.json 기반으로 의존성 정확히 설치 (npm install보다 엄격)
      - name: Install dependencies
        run: npm ci

      # 4) 코드 스타일/문법 검사
      - name: Run lint
        run: npm run lint

      # 5) 프로덕션 빌드 (dist/ 폴더 생성)
      #    GitHub Secrets에 저장된 비밀키들을 빌드 시점에 주입
      #    → 코드에는 키가 안 보이지만, 빌드된 결과물엔 들어감
      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_LEMON_SQUEEZY_STORE_ID: ${{ secrets.VITE_LEMON_SQUEEZY_STORE_ID }}
          VITE_LEMON_SQUEEZY_PRODUCT_ID: ${{ secrets.VITE_LEMON_SQUEEZY_PRODUCT_ID }}

      # 6) 빌드 결과물(dist/)을 GitHub 임시 저장소에 14일간 보관
      #    → 다음 deploy job이 다운로드해서 사용
      #    PR일 때는 어차피 배포 안 하니까 업로드 생략 (시간/용량 절약)
      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 14

# ===================================================================
# 🚀 JOB 2: 실배포 (deploy)
# ===================================================================
  deploy:
    name: Deploy frontend to S3
    runs-on: ubuntu-latest
    needs: validate                # validate가 성공해야만 실행됨 (의존성)
    # 배포 조건: PR이 아니고(=push 또는 수동), 브랜치가 main일 때만
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production             # GitHub Environments 'production' 사용 (보호 규칙 적용 가능)
      url: https://prep4saa.com    # 배포 후 GitHub UI에 표시되는 링크

    steps:
      # 1) validate job이 만들어둔 빌드 결과물 다운로드
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # 2) AWS 인증 설정 (이후 aws CLI 명령어가 이 자격증명 사용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3) 정적 자산(JS/CSS/이미지) 업로드
      #    --delete           : S3에 있는데 dist에 없는 파일은 삭제 (동기화)
      #    --exclude          : index.html은 별도 처리 (캐시 정책이 다름)
      #    --cache-control    : 1년간 캐시 + immutable
      #                         (파일명에 해시가 붙어있어 변경되면 새 파일이 됨)
      - name: Deploy static assets
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      # 4) 진입점(index.html)만 따로 업로드 — 캐시 절대 안 함
      #    이유: index.html이 캐시되면 사용자가 옛 버전 JS를 계속 보게 됨
      - name: Deploy entrypoint
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # 5) CloudFront(CDN) 캐시 무효화 → 전 세계 엣지 서버에서 옛 파일 즉시 폐기
      #    /index.html: 진입점 새 버전 즉시 반영
      #    /*         : 혹시 모를 다른 캐시도 모두 비움
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/index.html" "/*"
