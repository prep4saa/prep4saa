# ===================================================================
# CI 워크플로우 — PR 검증 전용 (배포 X)
# - PR이 main 또는 staging으로 들어올 때 실행
# - 5개 job 병렬 실행: validate / codeql / trivy / bundle-size / lighthouse
# - 실패 시 PR 머지 차단 (브랜치 보호 규칙과 연동)
# ===================================================================
name: CI

on:
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - 'lambda-webhook/**'                        # 람다 코드는 별도 워크플로우
      - '.github/workflows/deploy-api-gateway.yml' # API Gateway 워크플로우
      - '.github/workflows/lambda-deploy.yml'      # Lambda 배포
      - '**/*.md'                                  # 문서

# -------------------------------------------------------------------
# 동시 실행 제어 — 같은 PR에 새 커밋 push되면 이전 CI 자동 취소
# -------------------------------------------------------------------
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# -------------------------------------------------------------------
# 권한 — 기본은 코드 읽기만, 각 job에서 필요한 권한만 추가 부여 (최소권한)
# -------------------------------------------------------------------
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # =================================================================
  # JOB 1: validate — lint + typecheck + build 검증
  # =================================================================
  validate:
    name: Validate (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_LEMON_SQUEEZY_STORE_ID: ${{ secrets.VITE_LEMON_SQUEEZY_STORE_ID }}
          VITE_LEMON_SQUEEZY_PRODUCT_ID: ${{ secrets.VITE_LEMON_SQUEEZY_PRODUCT_ID }}

  # =================================================================
  # JOB 2: codeql — 정적 보안 분석 (SAST)
  # GitHub 공식 도구. JS/TS 코드의 XSS, SQL injection, prototype pollution
  # 같은 보안 취약점을 자동 감지. 결과는 Security 탭에 표시됨.
  # =================================================================
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF 결과를 Security 탭에 업로드하려면 필요
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # extended 쿼리팩 — security-and-quality 둘 다 포함 (더 많은 검사)
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # =================================================================
  # JOB 3: trivy — 의존성/파일 취약점 스캔
  # package-lock.json을 보고 알려진 CVE가 있는 npm 패키지를 찾아냄.
  # CRITICAL/HIGH 만 보고 (LOW/MEDIUM은 노이즈가 너무 많음).
  # =================================================================
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF 업로드용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # 취약점 발견돼도 워크플로우는 통과시킴 (Security 탭에 보고만)
          # 운영 정책 잡힌 후엔 exit-code: '1'로 변경해서 PR 차단 가능
          exit-code: '0'
          ignore-unfixed: true   # 패치 없는 CVE는 무시 (대응 불가)

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()             # 스캔 실패해도 결과 업로드
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # =================================================================
  # JOB 4: bundle-size — 빌드 결과물 크기 변화 추적
  # PR 머지 시 dist/ 사이즈가 얼마나 변할지 자동으로 PR에 댓글로 표시.
  # 예: "dist/assets/index.js: 245 KB → 251 KB (+6 KB)"
  # base 브랜치와 PR 브랜치 둘 다 빌드해서 비교 (약 2배 시간).
  # =================================================================
  bundle-size:
    name: Bundle Size Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # PR에 댓글 달기

    # preactjs/compressed-size-action이 build를 직접 실행하므로
    # job 레벨에서 환경변수 주입 (Vite가 빌드 시 키 필요)
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      VITE_LEMON_SQUEEZY_STORE_ID: ${{ secrets.VITE_LEMON_SQUEEZY_STORE_ID }}
      VITE_LEMON_SQUEEZY_PRODUCT_ID: ${{ secrets.VITE_LEMON_SQUEEZY_PRODUCT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compressed size diff
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'dist/**/*.{js,css,html}'   # 측정 대상
          build-script: 'build'                 # npm run build 실행
          # gzip 압축 후 크기로 비교 (실제 사용자 다운로드 크기에 가까움)

  # =================================================================
  # JOB 5: lighthouse — 성능/접근성/SEO 점수 측정
  # 빌드된 dist/를 로컬에서 serve하고 Lighthouse 돌림.
  # 결과는 PR에 댓글로 + 임시 호스팅 URL 제공 (HTML 리포트).
  # 점수가 임계치 미만이면 'warn'으로만 표시 (빌드는 통과)
  # 운영 안정화 후 'error'로 바꿔서 PR 차단 가능.
  # =================================================================
  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_LEMON_SQUEEZY_STORE_ID: ${{ secrets.VITE_LEMON_SQUEEZY_STORE_ID }}
          VITE_LEMON_SQUEEZY_PRODUCT_ID: ${{ secrets.VITE_LEMON_SQUEEZY_PRODUCT_ID }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true               # JSON 결과를 워크플로우 artifact로
          temporaryPublicStorage: true        # HTML 리포트 임시 호스팅 URL 생성
