# ===================================================================
# Lambda 함수 배포 워크플로우
# - lambda-webhook/ 디렉토리 변경 시 자동 트리거
# - Lambda 함수 코드 + 환경변수 업데이트
#
# 처리하는 Lambda 함수:
#   lemon-squeezy-webhook
#   → Lemon Squeezy 결제 웹훅 수신 → Firebase에 paid 상태 업데이트
#
# ⚠️ 주의: 현재 영구 AWS 키(secrets.AWS_ACCESS_KEY_ID/SECRET) 사용 중
#         Day 1 OIDC 마이그레이션에서 이 키들이 삭제되었으므로
#         이 워크플로우는 트리거되면 실패함.
#         → TODO: OIDC Role assume 방식으로 전환 필요 (deploy.yml 참고)
# ===================================================================
name: Deploy Lambda

on:
  # Disabled: lambda-webhook/ removed during Firebase->Cognito migration.
  # Re-enable when a replacement Lambda is wired up via OIDC.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Lambda 런타임 매칭 (Node 20 사용)
      # 운영용 의존성만 설치 (--production)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # devDependencies 제외하고 dependencies만 설치 → 패키지 크기 최소화
      - name: Install Lambda dependencies
        working-directory: lambda-webhook
        run: npm install --production

      # =============================================================
      # Lambda 배포 패키지 생성 (zip)
      # - lambda-webhook/ 내용을 lambda-webhook.zip으로 압축
      # - .git 관련 파일 제외 (-x "*.git*")
      # =============================================================
      - name: Create deployment package
        working-directory: lambda-webhook
        run: |
          zip -r ../lambda-webhook.zip . -x "*.git*"

      # =============================================================
      # Lambda 함수 코드 업데이트
      # ⚠️ 영구 AWS 키 인증 — OIDC로 마이그레이션 예정
      # =============================================================
      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name lemon-squeezy-webhook \
            --zip-file fileb://lambda-webhook.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # =============================================================
      # Lambda 환경변수 설정 (코드 외부 의존성 주입)
      # - FIREBASE_SERVICE_ACCOUNT: Firebase Admin SDK 인증 (JSON 통째로)
      # - LEMON_SQUEEZY_API_KEY: 결제 정보 조회용
      # - LEMON_SQUEEZY_WEBHOOK_SECRET: 웹훅 서명 검증용
      # =============================================================
      - name: Configure Lambda Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name lemon-squeezy-webhook \
            --environment Variables='{FIREBASE_SERVICE_ACCOUNT="${{ secrets.FIREBASE_SERVICE_ACCOUNT }}",LEMON_SQUEEZY_API_KEY="${{ secrets.LEMON_SQUEEZY_API_KEY }}",LEMON_SQUEEZY_WEBHOOK_SECRET="${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}"}' \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # Lambda 환경변수 변경은 비동기로 적용됨 → 5초 대기
      - name: Wait for Lambda update
        run: sleep 5

      # 배포 후 상태 확인 (디버깅 + 배포 완료 검증)
      # 출력값에서 Runtime, Handler, Environment 등 확인 가능
      - name: Verify Lambda deployment
        run: |
          aws lambda get-function-configuration \
            --function-name lemon-squeezy-webhook \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
