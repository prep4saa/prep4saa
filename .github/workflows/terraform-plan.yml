name: Terraform Plan

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        stack:
          - infra/github-repository
          - infra/iam
          - infra/backups
          - infra/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check required variables
        run: |
          if [ -z "${{ vars.TERRAFORM_PLAN_ROLE_ARN }}" ]; then
            echo "Missing GitHub variable: TERRAFORM_PLAN_ROLE_ARN"
            exit 1
          fi

          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "Missing GitHub variable: AWS_REGION"
            exit 1
          fi

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.stack)) }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Prepare Terraform plugin cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=${{ matrix.stack }} init
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

      - name: Terraform Format Check
        run: terraform -chdir=${{ matrix.stack }} fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.stack }} validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          {
            echo "Stack: ${{ matrix.stack }}"
            echo
            terraform -chdir=${{ matrix.stack }} plan -detailed-exitcode -no-color -input=false
          } > plan.txt 2>&1
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          cat plan.txt

      - name: Comment Terraform Plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('plan.txt')
              ? fs.readFileSync('plan.txt', 'utf8')
              : 'Terraform plan did not run. Check the workflow logs for the failed earlier step.';
            const stack = '${{ matrix.stack }}';
            const marker = `<!-- terraform-plan:${stack} -->`;
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const status =
              exitCode === '0' ? 'No changes' :
              exitCode === '2' ? 'Changes detected' :
              'Failed';
            const body = [
              marker,
              `## Terraform Plan: \`${stack}\` - ${status}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan.slice(0, 60000),
              '```',
              '',
              '</details>'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find(comment => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Upload Terraform Plan Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ strategy.job-index }}
          path: plan.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if Terraform Plan Failed
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1
