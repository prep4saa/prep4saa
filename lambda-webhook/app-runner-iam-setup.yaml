AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM roles and policies for App Runner service'

Resources:
  # IAM Role for App Runner Instance
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AppRunnerInstanceRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'
      Policies:
        - PolicyName: FirebaseServiceAccountPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource: 'arn:aws:secretsmanager:*:*:secret:firebase-*'

  # IAM Role for App Runner to access ECR
  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AppRunnerECRAccessRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apprunner.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly'
      Policies:
        - PolicyName: AppRunnerECRPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                Resource: '*'

  # CloudWatch Log Group for App Runner
  AppRunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apprunner/prep4saa-server
      RetentionInDays: 7

Outputs:
  AppRunnerInstanceRoleArn:
    Description: ARN of the App Runner Instance Role
    Value: !GetAtt AppRunnerInstanceRole.Arn
    Export:
      Name: AppRunnerInstanceRoleArn

  AppRunnerECRAccessRoleArn:
    Description: ARN of the App Runner ECR Access Role
    Value: !GetAtt AppRunnerECRAccessRole.Arn
    Export:
      Name: AppRunnerECRAccessRoleArn
